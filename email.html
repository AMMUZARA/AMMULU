<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Replace YOUR_FORM_ID with your Formspree form ID -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <input
            type="text"
            name="search_query"
            placeholder="Search..."
            required
        >
        <button type="submit">Search</button>
    </form>

</body>
</html>
